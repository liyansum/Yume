name: Inspect Art3m1s build cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-cache:
    name: Inspect cached Rust archives
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore native build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .native-build/downloads
            .native-build/vcpkg-downloads
            .native-build/vcpkg-binary-cache
            .native-build/art3m1s
          key: yume-native-cache-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-test-ipa.yml', 'ThirdParty/RuntimeDependencies.lock.json', 'ThirdParty/AetherKiri/Source/vcpkg-configuration.json', 'ThirdParty/AetherKiri/Source/vcpkg.json', 'ThirdParty/AetherKiri/Source/vcpkg/triplets/*.cmake', 'ThirdParty/AetherKiri/Source/vcpkg/ports/**') }}
          fail-on-cache-miss: true

      - name: Inspect Art3m1s archives
        shell: bash
        run: |
          set -euo pipefail
          release_root=".native-build/art3m1s/target/aarch64-apple-ios/release"
          archives=()
          while IFS= read -r archive; do
            archives+=("$archive")
          done < <(find "$release_root" -maxdepth 2 -type f \
            -name 'libart3m1s_core*.a' -size +0c -print | sort)
          if (( ${#archives[@]} == 0 )); then
            echo "No cached Art3m1s static archives were found." >&2
            exit 3
          fi
          for archive in "${archives[@]}"; do
            echo "::group::$archive"
            stat -f 'size=%z modified=%Sm' "$archive"
            file "$archive"
            echo "members=$(/usr/bin/ar -t "$archive" | wc -l | tr -d ' ')"
            set +e
            xcrun nm -gUj "$archive" >/dev/null 2>&1
            nm_status=$?
            set -e
            echo "nm_exit_status=$nm_status"
            symbols="$(xcrun nm -gUj "$archive" 2>/dev/null | \
              grep -E '^_art3m1s_(runtime_|register_|set_)' || true)"
            if [[ -n "$symbols" ]]; then
              printf '%s\n' "$symbols" | sort -u
            else
              echo "No Art3m1s host FFI symbols."
            fi
            echo "::endgroup::"
          done

          copied_archive="$RUNNER_TEMP/libart3m1s_core.a"
          /usr/bin/ditto --noqtn "${archives[0]}" "$copied_archive"
          for required_symbol in \
            _art3m1s_runtime_create \
            _art3m1s_runtime_advance_and_render; do
            if ! (
              set +o pipefail
              xcrun nm -gUj "$copied_archive" 2>/dev/null | \
                grep -Fx "$required_symbol" >/dev/null
            ); then
              echo "Required symbol is missing after archive copy: $required_symbol" >&2
              exit 4
            fi
          done
          echo "Copied archive passes host FFI verification."
